name: Deploy Static Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Static Assets & Resume Downloads
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          test -s assets/css/styles.css
          test -s assets/js/main.js
          test -s assets/img/avatar.png
          test -s assets/img/favicon.png
          test -s assets/img/og-thumbnail.png
          test -s downloads/smit_patel.pdf
          test -s downloads/SMIT_PATEL.docx

          # Ensure no root-relative /downloads/ URLs exist (prevents subpath 404s on GitHub Project Pages)
          if grep -Eq 'href="/downloads/' index.html; then
            echo "Error: Found root-relative /downloads/ link in index.html. Use ./downloads/ instead."
            exit 1
          fi
          echo "All static assets and downloadable resume files verified."

      - name: Assemble Clean Distribution Directory
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -r assets downloads dist/
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -i "s/?v=3\.0\.0/?v=${SHORT_SHA}/g" dist/index.html

      - name: Publish to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
